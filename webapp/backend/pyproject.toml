[project]
name = "caries-seg-backend"
version = "0.1.0"
description = "FastAPI backend for the caries segmentation web application"
requires-python = ">=3.11"

dependencies = [
    # Web framework — includes uvicorn and standard extras (email-validator, etc.)
    "fastapi[standard]>=0.111.0",

    # Async ORM + PostgreSQL driver.
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",

    # Database schema migrations.
    "alembic>=1.13.0",

    # Environment-based configuration via pydantic models.
    "pydantic-settings>=2.2.0",

    # Multipart form parsing for file uploads.
    "python-multipart>=0.0.9",

    # Array operations used in preprocessing and mask composition.
    "numpy>=1.26.0",

    # Image I/O and resize.  Headless variant omits GUI/display dependencies.
    "opencv-python-headless>=4.9.0.80",
]

[project.optional-dependencies]
# ---------------------------------------------------------------------------
# Inference extras — added in Phase 3.
#
# Published as an extras group so the same pyproject.toml works when the
# package is installed from PyPI.  In Docker add ".[inference]" to the
# uv sync call:  uv sync --extra inference --no-dev
# ---------------------------------------------------------------------------
inference = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "ultralytics>=8.1.0",
]

# ---------------------------------------------------------------------------
# Development dependencies — local-only, never published.
#
# Uses [dependency-groups] (PEP 735) rather than optional-dependencies so
# uv can manage them with --dev / --no-dev flags independently of extras.
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "testcontainers[postgres]>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only package the app/ directory; src/ is copied separately by the Dockerfile.
packages = ["app"]
