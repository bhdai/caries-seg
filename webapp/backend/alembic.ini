# Alembic configuration for the caries-seg backend.
#
# The sqlalchemy.url is intentionally left blank here; it is injected at
# runtime by env.py, which reads the DATABASE_URL environment variable.
# This avoids embedding credentials in a file that may be committed.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Disable the automatic comparison of server-default values to reduce noise
# in autogenerated migration diffs.
compare_server_default = false

[post_write_hooks]
# No post-write hooks configured.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
